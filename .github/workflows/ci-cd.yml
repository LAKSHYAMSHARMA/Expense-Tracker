name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: expensetracker
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Run backend tests
      working-directory: ./java-backend
      env:
        DATABASE_URL: jdbc:mysql://localhost:3306/expensetracker
        DATABASE_USERNAME: root
        DATABASE_PASSWORD: password
        AUTH_CLIENT_ID: test-client-id
        FRONTEND_URL: http://localhost:5173
        JWT_SECRET: test-secret-key-at-least-32-characters-long
      run: mvn test

    - name: Build backend with Maven
      working-directory: ./java-backend
      run: mvn clean package -DskipTests

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: react-frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./react-frontend
      run: npm ci
    
    - name: Run linter
      working-directory: ./react-frontend
      run: npm run lint
    
    - name: Build frontend
      working-directory: ./react-frontend
      env:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_GOOGLE_CLIENT_ID: test-client-id
      run: npm run build

  build-and-push-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: ./java-backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/expense-tracker-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./react-frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/expense-tracker-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
