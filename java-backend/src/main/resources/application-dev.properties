# Development Environment Configuration

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/expensetracker}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration - Development (More verbose)
logging.level.root=INFO
logging.level.com.expenseTracker=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}
google.oauth.client-id=${AUTH_CLIENT_ID}

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-super-secret-jwt-key-change-this-in-production-minimum-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,env,configprops
management.endpoint.health.show-details=always

# Development Server Configuration
server.port=8080
server.error.include-stacktrace=always
server.error.include-message=always
