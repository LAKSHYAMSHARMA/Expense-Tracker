# Production Environment Configuration

# Database Configuration (Use strong credentials in production)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration - Production (Minimal)
logging.level.root=WARN
logging.level.com.expenseTracker=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Application Configuration
frontend.url=${FRONTEND_URL}
google.oauth.client-id=${AUTH_CLIENT_ID}

# JWT Configuration (MUST be set via environment variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator Configuration - Limited in production
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Production Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-stacktrace=never
server.error.include-message=never

# Security
server.ssl.enabled=false
# Uncomment to enable HTTPS
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
